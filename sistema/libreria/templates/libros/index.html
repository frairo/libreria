{% extends "base.html" %}

{% block titulo %} lista de libros {% endblock %}

{% block contenido %}
<div class="card">
    <div class="card-header">
        <a
            name=""
            id=""
            class="btn btn-success"
            href="{% url 'crear' %}"
            role="button"
            >Agregar nuevo libro</a
        >
        
    </div>
    <div class="card-body">
        <h4 class="card-title">libros</h4>

        <div
            class="table-responsive"
        >
            <table
                class="table table-primary"
            >
                <thead>
                    
                    <tr>
                        <th> ID </th>
                        <th > Titulos </th>
                        <th > imagen </th>
                        <th >Descripcion</th>
                        <th > acciones </th>
                    </tr>
                </thead>
                <tbody>

                    {% for libro in libros %}
                    <tr>
                        <td>{{libro.id}}</td>
                        <td>{{libro.titulo}}</td>
                        <td>
                            <img src="{{libro.imagen.url}}" height="100" />
                        
                        </td>
                        <td>{{libro.descripcion}}</td>
                        <td>  
                         <a
                            name=""
                            id=""
                            class="btn btn-info"
                            href="{% url 'editar' libro.id %}"
                            role="button"
                            >Editar</a
                        >

                          
                         <a
                            name=""
                            id=""
                            class="btn btn-primary"
                            href="{% url 'eliminar' libro.id %}"
                            role="button"
                            >Borrar</a
                          >
                          
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        
        

    </div>
    <div class="card-footer text-muted">





    </div>
</div>


{% endblock %}
